# Compiles the CV on every change and publishes it on GitHub Pages, so
# https://matskahl.github.io/cv/CV_Mats_Kahl.pdf always serves the current version.
name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "CV_Mats_Kahl.tex"
      - "index.html"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_Mats_Kahl.tex

      - name: Assemble site
        run: |
          mkdir _site
          cp CV_Mats_Kahl.pdf index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}CV_Mats_Kahl.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
